<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Manager Companion</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main>
<header><div><h1>Cloud Manager</h1><small id="programLabel">Configure connection to begin</small></div><button id="settings" class="ghost" title="Settings">Settings</button></header>
<div class="toolbar"><nav aria-label="Sections"><button data-tab="pipelines" class="active" aria-current="page">Pipelines</button><button data-tab="variables">Variables</button><button data-tab="environments">Environments</button></nav><button id="refresh" class="ghost" title="Refresh catalog and expanded environments">Refresh</button></div>
<div id="environmentControl" class="select-control"><select id="environment" aria-label="Select environment" class="hidden"></select></div>
<div id="message" role="status" class="section muted"></div><div id="viewLoader" class="view-loader" role="status" hidden><span class="card-loader" aria-hidden="true"></span><span id="viewLoaderLabel">Loading…</span></div><section id="content" class="scroll" aria-label="Cloud Manager content"></section>
</main><script type="module" src="popup.js"></script></body></html>
