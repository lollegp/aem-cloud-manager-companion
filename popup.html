<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"><title>Cloud Manager Companion</title><script src="theme.js"></script><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main>
<header><div><h1>Cloud Manager</h1><small id="programLabel">Configure connection to begin</small></div><div class="header-tools"><details class="external-links"><summary>Adobe links</summary><div id="cloudManagerLinks" class="actions" aria-label="Adobe Cloud Manager links"></div></details><button id="settings" class="ghost" title="Settings">Settings</button></div></header>
<div class="program-switcher"><label for="programProfile">Program</label><div class="select-control"><select id="programProfile" aria-label="Program connection profile"></select></div></div>
<div class="toolbar"><nav aria-label="Sections"><button data-tab="pipelines" class="active" aria-current="page">Pipelines</button><button data-tab="variables">Variables</button><button data-tab="environments">Environments</button></nav><button id="refresh" class="ghost" title="Refresh catalog and expanded environments">Refresh</button></div>
<div id="environmentControl" class="select-control"><select id="environment" aria-label="Select environment" class="hidden"></select></div>
<output id="message" class="section muted"></output><output id="viewLoader" class="view-loader" hidden><span class="card-loader" aria-hidden="true"></span><span id="viewLoaderLabel">Loading…</span></output><section id="content" class="scroll" aria-label="Cloud Manager content"></section>
</main><script type="module" src="popup.js"></script></body></html>
